<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Wrong hole</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;1,400&family=Outfit:wght@300;400&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
  <style>
    body { overflow: auto; cursor: auto; }
    .lost { position: relative; z-index: 9; min-height: 100dvh; display: grid; place-items: center; text-align: center; padding: 48px 24px; }
    .lost h1 { font-family: "Cormorant Garamond", Georgia, serif; font-size: clamp(42px, 8vw, 88px); font-weight: 500; }
    .lost p { margin: 16px 0 28px; color: #8a8278; letter-spacing: 0.12em; text-transform: uppercase; font-size: 12px; }
    .lost a { color: #2a2724; text-decoration: none; border-bottom: 1px solid #c9c0b3; padding-bottom: 2px; }
  </style>
</head>
<body>
  <div class="grain"></div>
  <div class="wash"></div>
  <main class="lost">
    <div>
      <p>404</p>
      <h1>wrong hole</h1>
      <p>the rabbit did not come this way</p>
      <a href="./">follow it back</a>
    </div>
  </main>
</body>
</html>
